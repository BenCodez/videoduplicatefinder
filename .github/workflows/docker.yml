name: Docker (Web UI)

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish versioned images from the selected version tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      version: ${{ steps.prepare.outputs.version }}
      image: ${{ steps.prepare.outputs.image }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate publication intent
        id: prepare
        env:
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
        run: python3 .github/scripts/publication.py prepare --allow-release

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build vdf-web without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: VDF.Web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: vdf-web:validation
          build-args: |
            VDF_SOURCE_REVISION=${{ github.sha }}
            VDF_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}
      - name: Install the browser smoke client
        run: |
          python -m pip install -r .github/scripts/web-container-smoke-requirements.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: Run the image on its native architecture
        env:
          VDF_SOURCE_REVISION: ${{ github.sha }}
          VDF_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          python .github/scripts/web_container_smoke.py --image vdf-web:validation --arch ${{ matrix.arch }}
          --revision "$VDF_SOURCE_REVISION" --source-url "$VDF_SOURCE_URL"
      - name: Export the validated image
        if: needs.prepare.outputs.publish == 'true'
        run: docker save vdf-web:validation | gzip > web-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: web-${{ matrix.arch }}
          path: web-image.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: web-publication-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Revalidate the source tag
        env:
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
        run: python3 .github/scripts/publication.py prepare --allow-release
      - uses: actions/download-artifact@v5
        with:
          pattern: web-*
          path: web-images
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both validated architectures
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            gzip -dc "web-images/web-$arch/web-image.tar.gz" | docker load
            test "$(docker image inspect vdf-web:validation --format '{{.Architecture}}')" = "$arch"
            docker tag vdf-web:validation "$IMAGE:$SOURCE_SHA-$arch"
          done
          # Load and verify both artifacts before making any registry write.
          python3 .github/scripts/publication.py prepare --allow-release
          for arch in amd64 arm64; do
            docker push "$IMAGE:$SOURCE_SHA-$arch"
          done
          # Uploads can take minutes; validate again at the manifest boundary.
          python3 .github/scripts/publication.py prepare --allow-release
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:$SOURCE_SHA" \
            "$IMAGE:$SOURCE_SHA-amd64" "$IMAGE:$SOURCE_SHA-arm64"
