name: Build releases

# Pushes and PRs validate packages. Publication requires an explicit manual run
# selecting a version tag and publish=true; existing releases are preserved.

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish native packages from the selected version tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate publication intent
        id: prepare
        env:
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
        run: python3 .github/scripts/publication.py prepare

  build:
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        kind: ['linux', 'windows', 'windowsarm64', 'macOS', 'macOSarm64', 'linuxarm64']
        include:
          - kind: linux
            os: ubuntu-latest
            target: linux-x64
            name: linux-x64
          - kind: windows
            os: windows-latest
            target: win-x64
            name: win-x64
          - kind: windowsarm64
            # Native ARM64 runner (same reasoning as linux-arm64): Native AOT
            # builds on its own architecture instead of relying on the x64
            # image's cross toolchain. The FFmpeg auto-downloader already picks
            # the BtbN winarm64 shared build on ARM64 Windows.
            os: windows-11-arm
            target: win-arm64
            name: win-arm64
          - kind: macOS
            os: macos-latest
            target: osx-x64
            name: osx-x64
          - kind: macOSarm64
            os: macos-latest
            target: osx-arm64
            name: osx-arm64
          - kind: linuxarm64
            # Native ARM64 runner: Native AOT cannot cross-compile from x64 to
            # linux-arm64 without a cross toolchain, so build it on its own arch.
            os: ubuntu-24.04-arm
            target: linux-arm64
            name: linux-arm64
            
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Build
      shell: bash
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
          # Build GUI (Native AOT — verified AOT-safe for 4.0: compiled bindings,
          # source-generated JSON, statically-registered MemoryPack formatters)
          dotnet publish ./VDF.GUI/VDF.GUI.csproj -c Release -v q -p:PublishAot=true -p:VersionPrefix="$VERSION" -r "${{ matrix.target }}" -o "outputGUI"
          # Build CLI (Native AOT)
          dotnet publish ./VDF.CLI/VDF.CLI.csproj -c Release -v q -p:PublishAot=true -p:VersionPrefix="$VERSION" -r "${{ matrix.target }}" -o "outputCLI"
          # Build Web (JIT, self-contained — Blazor Server is not supported under Native AOT)
          dotnet publish ./VDF.Web/VDF.Web.csproj -c Release -v q --self-contained -p:VersionPrefix="$VERSION" -r "${{ matrix.target }}" -o "outputWeb"
          # Pack files
          if [[ "${{ matrix.target }}" == win-* ]]; then
            7z a -tzip "GUI-${{ matrix.target }}.zip" "./outputGUI/*"
            7z a -tzip "CLI-${{ matrix.target }}.zip" "./outputCLI/*"
            7z a -tzip "Web-${{ matrix.target }}.zip" "./outputWeb/*"
          elif [[ "${{ matrix.target }}" == osx-* ]]; then
            # Wrap the GUI in a proper macOS .app bundle
            mkdir -p "Video Duplicate Finder.app/Contents/MacOS"
            mkdir -p "Video Duplicate Finder.app/Contents/Resources"
            cp -r outputGUI/. "Video Duplicate Finder.app/Contents/MacOS/"
            cp "VDF.GUI/Assets/macOS/icon.icns" "Video Duplicate Finder.app/Contents/Resources/icon.icns"
            cp "VDF.GUI/Assets/macOS/Info.plist" "Video Duplicate Finder.app/Contents/Info.plist"
            plutil -replace CFBundleShortVersionString -string "$VERSION" "Video Duplicate Finder.app/Contents/Info.plist"
            plutil -replace CFBundleVersion -string "$VERSION" "Video Duplicate Finder.app/Contents/Info.plist"
            chmod +x "Video Duplicate Finder.app/Contents/MacOS/VDF.GUI"
            # Ad-hoc sign every binary in the bundle. macOS 14+ (and especially Tahoe 26)
            # rejects unsigned dylibs under Library Validation, which previously caused
            # "library load disallowed by system policy" on launch.
            codesign --force --deep --sign - \
              --entitlements "VDF.GUI/Assets/macOS/entitlements.plist" \
              "Video Duplicate Finder.app"
            codesign --verify --deep --strict --verbose=2 "Video Duplicate Finder.app"
            tar czvf "GUI-${{ matrix.target }}.tar.gz" "Video Duplicate Finder.app"
            chmod +x outputCLI/vdf-cli
            chmod +x outputWeb/VDF.Web
            codesign --force --deep --sign - \
              --entitlements "VDF.GUI/Assets/macOS/entitlements.plist" \
              outputCLI/vdf-cli
            codesign --force --deep --sign - \
              --entitlements "VDF.GUI/Assets/macOS/entitlements.plist" \
              outputWeb/VDF.Web
            tar czvf "CLI-${{ matrix.target }}.tar.gz" "outputCLI"
            tar czvf "Web-${{ matrix.target }}.tar.gz" "outputWeb"
          else
            # Bundle .desktop file and icon for Linux desktop integration
            cp "VDF.GUI/Assets/Linux/icon.png" "outputGUI/icon.png"
            cp "VDF.GUI/Assets/Linux/videoduplicatefinder.desktop" "outputGUI/videoduplicatefinder.desktop"
            tar czvf "GUI-${{ matrix.target }}.tar.gz" "outputGUI"
            tar czvf "CLI-${{ matrix.target }}.tar.gz" "outputCLI"
            tar czvf "Web-${{ matrix.target }}.tar.gz" "outputWeb"
          fi
          # Clean up
          rm -rf "outputGUI" "outputCLI" "outputWeb" "Video Duplicate Finder.app"
          
    - name: Retain validated packages
      uses: actions/upload-artifact@v4
      with:
          name: native-${{ matrix.target }}
          path: |
            GUI-*
            CLI-*
            Web-*
          if-no-files-found: error
          retention-days: 3

  publish-release:
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: native-publication-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          merge-multiple: true
          path: release-assets
      - name: Publish all validated packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
        run: python3 .github/scripts/publication.py publish-native
      # GITHUB_TOKEN release events do not start other workflows. Dispatch is
      # explicitly supported and runs only after native publication succeeds.
      - name: Dispatch Docker publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/publication.py prepare
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$VERSION_TAG" -f publish=true -f expected_sha="$GITHUB_SHA"


